<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<title>어린이 한글 타자 연습</title>
<style>
:root{--ink:#25314d;--yellow:#ffd65a;--blue:#78c9f3;--pink:#ff9fbd;--mint:#8cdec3;--paper:#fffdf7;--shadow:0 7px 0 rgba(37,49,77,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#fff8df,#eefaff);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;min-height:100dvh;overscroll-behavior:none}.hidden{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}.app{width:min(760px,100%);height:100dvh;min-height:620px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;overflow:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:clamp(18px,4vw,28px);font-weight:900}.stars{letter-spacing:4px;color:#ffad33}.small-btn{border:2px solid #d8e2ed;background:white;border-radius:16px;padding:9px 13px;font-weight:800}
.head-actions{display:flex;align-items:center;gap:6px}.mode-change{background:#fff4c7;border-color:#f1cf51}.mode-overlay{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#fff6d5,#e8f8ff);display:grid;place-items:center;padding:20px}.mode-box{width:min(620px,100%);background:rgba(255,255,255,.95);border:4px solid var(--ink);border-radius:30px;padding:clamp(20px,5vw,34px);box-shadow:0 14px 0 rgba(37,49,77,.14)}.mode-box h1{margin:0;text-align:center;font-size:clamp(27px,7vw,42px)}.mode-box p{text-align:center;color:#68758b;font-weight:700}.mode-options{display:grid;gap:12px;margin-top:22px}.mode-option{border:0;border-radius:22px;padding:16px;text-align:left;background:white;box-shadow:0 5px 0 #d7e0ea;border:2px solid #e3e9ef;display:grid;grid-template-columns:52px 1fr;align-items:center;gap:12px}.mode-option:active{transform:translateY(4px);box-shadow:0 1px 0 #d7e0ea}.mode-icon{font-size:38px}.mode-name{display:block;font-size:20px;font-weight:900}.mode-desc{display:block;margin-top:3px;font-size:13px;color:#68758b;font-weight:700}
.practice{background:#fff;border:2px solid #e8dfc8;border-radius:20px;padding:10px 12px;box-shadow:0 5px 15px rgba(84,67,24,.08)}.categories{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.cat{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;background:#eef2f6;font-size:15px;font-weight:900}.cat.active{background:var(--yellow);box-shadow:0 3px 0 #e6ae20}.mission{display:flex;align-items:center;justify-content:space-between;gap:8px}.target-label{font-size:12px;color:#778198;font-weight:800}.target{font-size:clamp(25px,6vw,38px);font-weight:900;letter-spacing:.08em}.next{flex:0 0 auto;border:0;border-radius:14px;padding:10px 12px;background:#dff7ef;font-weight:900}.complete{color:#15966f;animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.12)}}
.screen{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:var(--shadow);display:flex;flex:1 1 34vh;min-height:210px;align-items:center;justify-content:center;overflow:hidden;padding:22px}.screen:before,.screen:after{content:"★";position:absolute;color:#ffe085;font-size:26px}.screen:before{top:13px;left:16px}.screen:after{right:16px;bottom:10px}
#text{width:100%;text-align:center;font-size:clamp(64px,18vw,150px);line-height:1.15;font-weight:900;word-break:break-all;overflow-wrap:anywhere;white-space:pre-wrap;max-height:100%;overflow:auto;transition:font-size .14s ease}.placeholder{color:#cbd5df;font-size:clamp(28px,7vw,48px)!important}
.pad{background:rgba(255,255,255,.83);border:3px solid white;border-radius:25px;padding:12px;box-shadow:0 12px 30px rgba(77,120,150,.13);display:flex;flex:0 0 auto;flex-direction:column;min-height:0}.keyboard-all{display:grid;gap:clamp(9px,1.5vh,14px)}.group-title{font-size:14px;font-weight:900;margin:0 0 6px 3px}.group-title.c{color:#277ba9}.group-title.v{color:#c84f7d}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(6px,1vw,9px)}.key{height:clamp(48px,6.4vh,70px);border:0;border-radius:16px;background:var(--blue);box-shadow:0 5px 0 #4fa3d0;font-size:clamp(24px,6vw,38px);font-weight:900;transition:transform .16s ease,box-shadow .16s ease}.key.vowel{background:var(--pink);box-shadow:0 5px 0 #dc7699}.key:active,.action:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(37,49,77,.25)}.key.selected{outline:5px solid var(--yellow);transform:scale(.94)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px}.action{border:0;border-radius:15px;background:#edf2f7;min-height:48px;font-size:15px;font-weight:900;box-shadow:0 4px 0 #cbd5df}.action.speak{background:var(--mint);box-shadow:0 4px 0 #5dbb9d}.action.danger{background:#ffe6e6;box-shadow:0 4px 0 #f4b5b5}
.hint{text-align:center;font-size:13px;color:#68758b;margin-top:8px}@media(max-width:390px){.app{padding-left:9px;padding-right:9px;gap:8px}.keys{gap:6px}.key{height:clamp(46px,6vh,56px);border-radius:14px}.keyboard-all{gap:8px}.actions{gap:6px;margin-top:9px}.action{font-size:13px;padding:4px;min-height:44px}.screen{min-height:200px}}
.app.draw-active{overflow:hidden}.draw-panel{background:white;border:4px solid var(--ink);border-radius:26px;box-shadow:var(--shadow);padding:9px;min-height:0;flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden}.draw-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}.draw-mode{border:0;border-radius:14px;padding:9px 4px;background:#edf2f7;font-size:clamp(12px,3vw,16px);font-weight:900;box-shadow:0 4px 0 #cbd5df}.draw-mode.active{background:var(--yellow);box-shadow:0 4px 0 #e6ae20}.draw-practice{background:#fff9df;border:2px solid #f0d980;border-radius:16px;padding:7px 9px;margin-bottom:7px;flex:0 0 auto}.draw-categories{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.draw-categories::-webkit-scrollbar{display:none}.draw-target-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.draw-target{font-size:clamp(22px,5vw,34px);font-weight:900;letter-spacing:.08em}.draw-next{border:0;border-radius:12px;background:#dff7ef;padding:8px 10px;font-weight:900}.draw-title{text-align:center;font-weight:900;font-size:clamp(15px,3.5vw,18px);margin:1px 0 6px;flex:0 0 auto}.canvas-wrap{position:relative;flex:1 1 auto;min-height:150px;border:3px dashed #b9c8d8;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(0deg,#fff 0,#fff 69px,#e7eef5 70px,#e7eef5 72px)}#drawCanvas{display:block;width:100%;height:100%;touch-action:none}.draw-tools{display:flex;flex:0 0 auto;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:8px}.tool{border:2px solid #d8e2ed;border-radius:14px;background:#f5f8fb;padding:9px 12px;font-weight:900;transition:transform .14s ease,background-color .14s ease}.tool:active,.tool.pressed{transform:scale(.92);background:#ffe99a}.color{width:40px;padding:0;border-radius:50%}.color[data-color="#25314d"]{background:#25314d}.color[data-color="#ef5777"]{background:#ef5777}.color[data-color="#268bd2"]{background:#268bd2}.color.active{outline:4px solid var(--yellow)}
@media(max-width:520px){.stars{display:none}.small-btn{padding:8px 9px;font-size:13px}.draw-panel{min-height:0;padding:7px}.canvas-wrap{min-height:120px}.draw-tools{gap:5px;margin-top:6px}.tool{padding:7px 9px;font-size:13px}.color{width:36px}.draw-modes{margin-bottom:6px}.draw-practice{padding:6px 8px}.draw-categories .cat{padding:7px 11px;font-size:13px}}
</style>
</head>
<body><div class="mode-overlay" id="modeOverlay"><div class="mode-box"><h1>🌱 어떤 연습을 할까요?</h1><p>하고 싶은 방법을 하나 골라 주세요</p><div class="mode-options">
<button class="mode-option" data-mode="free"><span class="mode-icon">⌨️</span><span><span class="mode-name">자유 글쓰기</span><span class="mode-desc">키보드로 원하는 글자를 자유롭게 써요</span></span></button>
<button class="mode-option" data-mode="follow"><span class="mode-icon">🧩</span><span><span class="mode-name">낱말 따라쓰기</span><span class="mode-desc">동물·물건·채소·과일 낱말을 따라 써요</span></span></button>
<button class="mode-option" data-mode="draw"><span class="mode-icon">✍️</span><span><span class="mode-name">손글씨 쓰기</span><span class="mode-desc">화면에 손가락으로 직접 글씨를 써요</span></span></button>
</div></div></div><main class="app">
<header><div class="brand">🌱 한글 놀이터</div><div class="head-actions"><span class="stars">★★★</span><button class="small-btn mode-change" id="modeChange">모드 변경</button><button class="small-btn" id="soundToggle" aria-pressed="true">🔊 소리 켬</button></div></header>
<section class="practice" id="practice"><div class="categories" id="categories"></div><div class="mission"><div><div class="target-label">아래 낱말을 따라 써 보세요</div><div class="target" id="target">사자</div></div><button class="next" id="nextWord">다음 문제 ›</button></div></section>
<section class="screen" id="typingScreen" aria-live="polite"><div id="text" class="placeholder">글자를 만들어 봐요!</div></section>
<section class="pad" id="typingPad"><div class="keyboard-all"><div><div class="group-title c">자음</div><div class="keys" id="consonantKeys"></div></div><div><div class="group-title v">모음</div><div class="keys" id="vowelKeys"></div></div></div><div class="actions">
<button class="action" id="space">띄어쓰기</button><button class="action" id="undo">↩ 되돌리기</button><button class="action speak" id="speak">🔊 읽어줘</button><button class="action danger" id="clear">모두 지우기</button>
</div><div class="hint">받침과 다음 글자의 첫소리는 자동으로 구분됩니다</div></section>
<section class="draw-panel hidden" id="drawPanel"><div class="draw-modes"><button class="draw-mode active" data-draw-mode="free">✍️ 자유 손글씨</button><button class="draw-mode" data-draw-mode="trace">〰️ 점선 따라쓰기</button><button class="draw-mode" data-draw-mode="copy">👀 보고 따라쓰기</button></div><div class="draw-practice hidden" id="drawPractice"><div class="draw-categories" id="drawCategories"></div><div class="draw-target-row"><div><div class="target-label">따라 쓸 낱말</div><div class="draw-target" id="drawTarget">사자</div></div><button class="draw-next" id="drawNextWord">다음 문제 ›</button></div></div><div class="draw-title" id="drawTitle">손가락으로 자유롭게 써 보세요 ✍️</div><div class="canvas-wrap"><canvas id="drawCanvas"></canvas></div><div class="draw-tools"><button class="tool color active" data-color="#25314d" aria-label="검정 펜"></button><button class="tool color" data-color="#268bd2" aria-label="파란 펜"></button><button class="tool color" data-color="#ef5777" aria-label="분홍 펜"></button><button class="tool" id="thinPen">가는 펜</button><button class="tool" id="thickPen">굵은 펜</button><button class="tool" id="undoDraw">↩ 한 획</button><button class="tool" id="clearDraw">전체 지우기</button></div></section>
</main>
<script>
(()=>{'use strict';
const consonants=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const vowels=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
const choseong=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const jungseong=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const jongseong=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const wordSets={동물:['사자','나비','여우','오리','하마','곰','말','양'],물건:['모자','비누','구두','소파','라디오','컵','공'],채소:['오이','가지','무','고구마','토마토','콩'],과일:['바나나','포도','자두','파파야','아보카도','감','귤']};
const icons={동물:'🦁',물건:'🧸',채소:'🥕',과일:'🍎'};
let committed='',initial='',medial='',finalConsonant='',celebrated=false,category=localStorage.getItem('kids-hangul-category')||'동물',wordIndex=Number(localStorage.getItem('kids-hangul-word-index')||0);
const $=id=>document.getElementById(id),text=$('text'),target=$('target');
function currentWord(){return wordSets[category][wordIndex%wordSets[category].length]}
function renderPractice(){const box=$('categories');box.innerHTML='';Object.keys(wordSets).forEach(name=>{const b=document.createElement('button');b.className='cat'+(name===category?' active':'');b.textContent=icons[name]+' '+name;b.onclick=()=>chooseCategory(name);box.appendChild(b)});target.textContent=currentWord();target.classList.remove('complete')}
function renderDrawPractice(){const box=$('drawCategories');if(!box)return;box.innerHTML='';Object.keys(wordSets).forEach(name=>{const b=document.createElement('button');b.className='cat'+(name===category?' active':'');b.textContent=icons[name]+' '+name;b.onclick=()=>chooseCategory(name);box.appendChild(b)});$('drawTarget').textContent=currentWord();if(appMode==='draw')redrawCanvas()}
function resetWriting(){committed='';initial='';medial='';finalConsonant='';celebrated=false;renderText()}
function chooseCategory(name){category=name;wordIndex=0;localStorage.setItem('kids-hangul-category',category);localStorage.setItem('kids-hangul-word-index','0');renderPractice();renderDrawPractice();resetWriting();strokes=[];if(appMode==='draw')redrawCanvas();say(category+' 낱말이에요. '+currentWord())}
function nextWord(){wordIndex=(wordIndex+1)%wordSets[category].length;localStorage.setItem('kids-hangul-word-index',String(wordIndex));renderPractice();renderDrawPractice();resetWriting();strokes=[];if(appMode==='draw')redrawCanvas();say(currentWord())}
function compose(c=initial,v=medial,f=finalConsonant){const ci=choseong.indexOf(c),vi=jungseong.indexOf(v),fi=jongseong.indexOf(f);if(ci>=0&&vi>=0&&fi>=0)return String.fromCharCode(0xAC00+(ci*21+vi)*28+fi);return c+v+f}
function current(){return medial?compose():initial}
function fullText(){return committed+current()}
function renderText(){const shown=fullText();if(shown){text.textContent=shown;text.className=''}else{text.textContent=appMode==='free'?'자유롭게 써 보세요!':'따라 써 보세요!';text.className='placeholder'}if(appMode==='follow'&&!celebrated&&shown===currentWord()){celebrated=true;target.classList.add('complete');setTimeout(()=>say('참 잘했어요! '+currentWord()),120)}else if(shown!==currentWord()){celebrated=false;target.classList.remove('complete')}scheduleTextFit()}
function say(msg){if($('soundToggle').getAttribute('aria-pressed')!=='true'||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(msg);u.lang='ko-KR';u.rate=.72;u.pitch=1.2;speechSynthesis.speak(u)}
function animateKey(button){button.classList.add('selected');setTimeout(()=>button.classList.remove('selected'),180)}
function inputConsonant(letter,button){animateKey(button);if(!initial){initial=letter}else if(!medial){committed+=initial;initial=letter}else if(!finalConsonant){finalConsonant=letter}else{committed+=compose();initial=letter;medial='';finalConsonant=''}renderText();say(letter)}
function inputVowel(letter,button){animateKey(button);if(!initial){initial='ㅇ';medial=letter}else if(!medial){medial=letter}else if(finalConsonant){const carry=finalConsonant;committed+=compose(initial,medial,'');initial=carry;medial=letter;finalConsonant=''}else{committed+=compose();initial='ㅇ';medial=letter;finalConsonant=''}renderText();say(current())}
function renderKeys(){const ck=$('consonantKeys'),vk=$('vowelKeys');ck.innerHTML='';vk.innerHTML='';consonants.forEach(letter=>{const b=document.createElement('button');b.className='key';b.textContent=letter;b.setAttribute('aria-label',letter+' 자음');b.onclick=()=>inputConsonant(letter,b);ck.appendChild(b)});vowels.forEach(letter=>{const b=document.createElement('button');b.className='key vowel';b.textContent=letter;b.setAttribute('aria-label',letter+' 모음');b.onclick=()=>inputVowel(letter,b);vk.appendChild(b)})}
function commitCurrent(){if(initial){committed+=current();initial='';medial='';finalConsonant=''}}
$('space').onclick=()=>{commitCurrent();committed+=' ';renderText()};
$('undo').onclick=()=>{if(finalConsonant)finalConsonant='';else if(medial)medial='';else if(initial)initial='';else if(committed)committed=Array.from(committed).slice(0,-1).join('');else say('지울 글자가 없어요');renderText()};
$('clear').onclick=()=>{if(fullText()&&confirm('쓴 글자를 모두 지울까요?'))resetWriting()};
$('speak').onclick=()=>say(fullText().trim()||'글자를 먼저 만들어 보세요');
$('nextWord').onclick=nextWord;
$('soundToggle').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')==='true';e.currentTarget.setAttribute('aria-pressed',String(!on));e.currentTarget.textContent=on?'🔇 소리 끔':'🔊 소리 켬';if(!on)say('소리를 켰어요')};

let appMode='',drawSubMode='free',penColor='#25314d',penWidth=6,strokes=[],activeStroke=null,drawing=false,fitFrame=0;
const canvas=$('drawCanvas'),ctx=canvas.getContext('2d');
function scheduleTextFit(){cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fitTextToScreen)}
function fitTextToScreen(){const box=$('typingScreen');if(!box||box.classList.contains('hidden')||text.classList.contains('placeholder')){text.style.fontSize='';return}const availableHeight=Math.max(60,box.clientHeight-44),availableWidth=Math.max(80,box.clientWidth-44);let low=18,high=Math.min(180,Math.max(72,availableWidth*.38)),best=low;for(let n=0;n<9;n++){const mid=(low+high)/2;text.style.fontSize=mid+'px';const fits=text.scrollHeight<=availableHeight+1&&text.scrollWidth<=availableWidth+1;if(fits){best=mid;low=mid}else high=mid}text.style.fontSize=Math.floor(best)+'px'}
function setMode(mode){appMode=mode;$('modeOverlay').classList.add('hidden');const draw=mode==='draw',follow=mode==='follow';document.querySelector('.app').classList.toggle('draw-active',draw);$('practice').classList.toggle('hidden',!follow);$('typingScreen').classList.toggle('hidden',draw);$('typingPad').classList.toggle('hidden',draw);$('drawPanel').classList.toggle('hidden',!draw);document.querySelector('.brand').textContent=draw?'✍️ 손글씨 놀이터':follow?'🧩 낱말 따라쓰기':'⌨️ 자유 글쓰기';if(!draw)resetWriting();if(draw){setDrawMode('free');requestAnimationFrame(resizeCanvas)}}
document.querySelectorAll('.mode-option').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('modeChange').onclick=()=>$('modeOverlay').classList.remove('hidden');
function setDrawMode(mode){drawSubMode=mode;document.querySelectorAll('.draw-mode').forEach(b=>b.classList.toggle('active',b.dataset.drawMode===mode));$('drawPractice').classList.toggle('hidden',mode==='free');$('drawTitle').textContent=mode==='free'?'손가락으로 자유롭게 써 보세요 ✍️':mode==='trace'?'점선 글자 위를 따라 써 보세요':'위 낱말을 보고 빈칸에 써 보세요';strokes=[];renderDrawPractice();requestAnimationFrame(resizeCanvas)}
document.querySelectorAll('.draw-mode').forEach(b=>b.onclick=()=>setDrawMode(b.dataset.drawMode));
$('drawNextWord').onclick=nextWord;
function resizeCanvas(){const wrap=canvas.parentElement,rect=wrap.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);if(rect.width<2||rect.height<2)return;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);redrawCanvas()}
function drawTraceGuide(dpr){if(drawSubMode!=='trace')return;const word=currentWord(),w=canvas.width/dpr,h=canvas.height/dpr;let size=Math.min(h*.5,170);ctx.font=`300 ${size}px "Apple SD Gothic Neo","Noto Sans KR",sans-serif`;while(size>42&&ctx.measureText(word).width>w-36){size-=4;ctx.font=`300 ${size}px "Apple SD Gothic Neo","Noto Sans KR",sans-serif`}ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='#9eafbf';ctx.lineWidth=1.25;ctx.setLineDash([1,7]);ctx.lineDashOffset=0;ctx.strokeText(word,w/2,h/2);ctx.restore()}
function redrawCanvas(){const dpr=Math.max(1,window.devicePixelRatio||1);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(dpr,0,0,dpr,0,0);drawTraceGuide(dpr);ctx.setLineDash([]);ctx.lineCap='round';ctx.lineJoin='round';strokes.forEach(s=>{if(!s.points.length)return;ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.moveTo(s.points[0].x,s.points[0].y);s.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));if(s.points.length===1){ctx.lineTo(s.points[0].x+.01,s.points[0].y+.01)}ctx.stroke()})}
function pointFromEvent(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);activeStroke={color:penColor,width:penWidth,points:[pointFromEvent(e)]};strokes.push(activeStroke);redrawCanvas()});
canvas.addEventListener('pointermove',e=>{if(!drawing||!activeStroke)return;e.preventDefault();activeStroke.points.push(pointFromEvent(e));redrawCanvas()});
function stopDrawing(){drawing=false;activeStroke=null}
canvas.addEventListener('pointerup',stopDrawing);canvas.addEventListener('pointercancel',stopDrawing);
document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{penColor=b.dataset.color;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('active',x===b))});
$('thinPen').onclick=()=>{penWidth=4;say('가는 펜')};$('thickPen').onclick=()=>{penWidth=10;say('굵은 펜')};
$('undoDraw').onclick=()=>{strokes.pop();redrawCanvas()};
$('clearDraw').onclick=e=>{const b=e.currentTarget;b.classList.remove('pressed');void b.offsetWidth;b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),180);strokes=[];redrawCanvas()};
window.addEventListener('resize',()=>{if(appMode==='draw')resizeCanvas();else scheduleTextFit()});
renderPractice();renderDrawPractice();renderText();renderKeys();
})();
</script></body></html>
