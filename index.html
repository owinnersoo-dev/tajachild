<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<title>어린이 한글 타자 연습</title>
<style>
:root{--ink:#25314d;--yellow:#ffd65a;--blue:#78c9f3;--pink:#ff9fbd;--mint:#8cdec3;--paper:#fffdf7;--shadow:0 7px 0 rgba(37,49,77,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#fff8df,#eefaff);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation}.app{width:min(760px,100%);min-height:100dvh;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(220px,42vh) auto 1fr;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:clamp(18px,4vw,28px);font-weight:900}.stars{letter-spacing:4px;color:#ffad33}.small-btn{border:2px solid #d8e2ed;background:white;border-radius:16px;padding:9px 13px;font-weight:800}
.screen{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:22px}.screen:before,.screen:after{content:"★";position:absolute;color:#ffe085;font-size:26px}.screen:before{top:13px;left:16px}.screen:after{right:16px;bottom:10px}
#text{width:100%;text-align:center;font-size:clamp(64px,18vw,150px);line-height:1.15;font-weight:900;word-break:break-all;white-space:pre-wrap;max-height:100%;overflow:auto}.placeholder{color:#cbd5df;font-size:clamp(28px,7vw,48px)!important}
.status{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:900;font-size:clamp(16px,4vw,22px)}.step{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--yellow)}
.pad{background:rgba(255,255,255,.83);border:3px solid white;border-radius:25px;padding:12px;box-shadow:0 12px 30px rgba(77,120,150,.13);display:flex;flex-direction:column;min-height:0}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;align-content:center;flex:1}.key{min-height:58px;border:0;border-radius:18px;background:var(--blue);box-shadow:0 5px 0 #4fa3d0;font-size:clamp(27px,7vw,42px);font-weight:900}.key.vowel{background:var(--pink);box-shadow:0 5px 0 #dc7699}.key:active,.action:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(37,49,77,.25)}.key.selected{outline:5px solid var(--yellow);transform:scale(.96)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px}.action{border:0;border-radius:15px;background:#edf2f7;min-height:48px;font-size:15px;font-weight:900;box-shadow:0 4px 0 #cbd5df}.action.speak{background:var(--mint);box-shadow:0 4px 0 #5dbb9d}.action.danger{background:#ffe6e6;box-shadow:0 4px 0 #f4b5b5}
.hint{text-align:center;font-size:13px;color:#68758b;margin-top:8px}@media(max-width:390px){.app{padding-left:9px;padding-right:9px;gap:9px}.keys{gap:7px}.key{min-height:52px;border-radius:15px}.actions{gap:6px}.action{font-size:13px;padding:4px}.screen{min-height:205px}}
</style>
</head>
<body><main class="app">
<header><div class="brand">🌱 한글 놀이터</div><div><span class="stars">★★★</span> <button class="small-btn" id="soundToggle" aria-pressed="true">🔊 소리 켬</button></div></header>
<section class="screen" aria-live="polite"><div id="text" class="placeholder">글자를 만들어 봐요!</div></section>
<div class="status"><span class="step" id="stepNo">1</span><span id="guide">먼저 자음을 눌러요</span></div>
<section class="pad"><div class="keys" id="keys"></div><div class="actions">
<button class="action" id="space">띄어쓰기</button><button class="action" id="undo">↩ 되돌리기</button><button class="action speak" id="speak">🔊 읽어줘</button><button class="action danger" id="clear">모두 지우기</button>
</div><div class="hint">자음과 모음을 차례로 누르면 한글이 완성돼요 · 내용은 자동 저장됩니다</div></section>
</main>
<script>
(()=>{'use strict';
const consonants=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const vowels=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
const choseong=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const jungseong=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
let value=localStorage.getItem('kids-hangul-text')||'', selected='', step='c';
const $=id=>document.getElementById(id), keys=$('keys'), text=$('text'), guide=$('guide'), stepNo=$('stepNo');
function renderText(){const shown=value+selected;if(shown){text.textContent=shown;text.className=''}else{text.textContent='글자를 만들어 봐요!';text.className='placeholder'}localStorage.setItem('kids-hangul-text',value)}
function say(msg){if($('soundToggle').getAttribute('aria-pressed')!=='true'||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(msg);u.lang='ko-KR';u.rate=.72;u.pitch=1.2;speechSynthesis.speak(u)}
function renderKeys(){const list=step==='c'?consonants:vowels;keys.innerHTML='';list.forEach(letter=>{const b=document.createElement('button');b.className='key '+(step==='v'?'vowel':'');b.textContent=letter;b.setAttribute('aria-label',letter);b.onclick=()=>press(letter,b);keys.appendChild(b)});stepNo.textContent=step==='c'?'1':'2';guide.textContent=step==='c'?'먼저 자음을 눌러요':'다음으로 모음을 눌러요';}
function press(letter,b){b.classList.add('selected');setTimeout(()=>b.classList.remove('selected'),160);if(step==='c'){selected=letter;step='v';renderText();say(letter);renderKeys()}else{const ci=choseong.indexOf(selected),vi=jungseong.indexOf(letter);const syllable=(ci>=0&&vi>=0)?String.fromCharCode(0xAC00+(ci*21+vi)*28):selected+letter;value+=syllable;selected='';step='c';renderText();renderKeys();say(syllable)}}
$('space').onclick=()=>{value+=' ';selected='';step='c';renderText();renderKeys()};
$('undo').onclick=()=>{if(step==='v'){selected='';step='c';renderKeys()}else if(value){value=Array.from(value).slice(0,-1).join('');renderText()}else say('지울 글자가 없어요')};
$('clear').onclick=()=>{if(value&&confirm('쓴 글자를 모두 지울까요?')){value='';selected='';step='c';renderText();renderKeys()}};
$('speak').onclick=()=>say(value.trim()||'글자를 먼저 만들어 보세요');
$('soundToggle').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')==='true';e.currentTarget.setAttribute('aria-pressed',String(!on));e.currentTarget.textContent=on?'🔇 소리 끔':'🔊 소리 켬';if(!on)say('소리를 켰어요')};
renderText();renderKeys();
})();
</script></body></html>
